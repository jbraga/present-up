<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PresentUp - Daily Attendance Timeline</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1c74e9",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111821",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Lexend', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .timeline-line {
            position: absolute;
            left: 23px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #e2e8f0;
        }
        .dark .timeline-line {
            background: #334155;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<header class="pt-8 px-6 pb-2 bg-background-light dark:bg-background-dark sticky top-0 z-20">
<div class="flex items-center justify-between mb-4">
<h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Attendance</h1>
<div class="flex gap-2">
<button class="p-2 rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400">search</span>
</button>
<button class="p-2 rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400">calendar_month</span>
</button>
</div>
</div>
<div class="flex overflow-x-auto no-scrollbar gap-3 pb-4 -mx-6 px-6">
<button class="flex flex-col items-center min-w-[56px] py-3 rounded-2xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200/60 dark:border-slate-700/50">
<span class="text-[10px] font-medium text-slate-400 uppercase">Mon</span>
<span class="text-lg font-bold">02</span>
</button>
<button class="flex flex-col items-center min-w-[56px] py-3 rounded-2xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200/60 dark:border-slate-700/50">
<span class="text-[10px] font-medium text-slate-400 uppercase">Tue</span>
<span class="text-lg font-bold">03</span>
</button>
<button class="flex flex-col items-center min-w-[56px] py-3 rounded-2xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200/60 dark:border-slate-700/50">
<span class="text-[10px] font-medium text-slate-400 uppercase">Wed</span>
<span class="text-lg font-bold">04</span>
</button>
<button class="flex flex-col items-center min-w-[56px] py-3 rounded-2xl bg-primary text-white shadow-lg shadow-primary/30 ring-4 ring-primary/10">
<span class="text-[10px] font-medium text-white/70 uppercase">Thu</span>
<span class="text-lg font-bold">05</span>
</button>
<button class="flex flex-col items-center min-w-[56px] py-3 rounded-2xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200/60 dark:border-slate-700/50">
<span class="text-[10px] font-medium text-slate-400 uppercase">Fri</span>
<span class="text-lg font-bold">06</span>
</button>
<button class="flex flex-col items-center min-w-[56px] py-3 rounded-2xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200/60 dark:border-slate-700/50">
<span class="text-[10px] font-medium text-slate-400 uppercase">Sat</span>
<span class="text-lg font-bold">07</span>
</button>
<button class="flex flex-col items-center min-w-[56px] py-3 rounded-2xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200/60 dark:border-slate-700/50">
<span class="text-[10px] font-medium text-slate-400 uppercase">Sun</span>
<span class="text-lg font-bold">08</span>
</button>
</div>
</header>
<main class="flex-1 overflow-y-auto pb-24 px-6 relative">
<div class="timeline-line ml-4"></div>
<div class="space-y-10 pt-4">
<div class="relative flex gap-6">
<div class="flex flex-col items-center z-10">
<div class="w-12 h-12 rounded-full bg-primary text-white flex items-center justify-center font-bold text-xs ring-4 ring-background-light dark:ring-background-dark">
                    09:00
                </div>
</div>
<div class="flex-1 bg-white dark:bg-slate-800/60 p-4 rounded-2xl shadow-sm border border-slate-200/60 dark:border-slate-700/50">
<h4 class="font-bold text-slate-900 dark:text-white text-base">Advanced Mathematics</h4>
<div class="mt-1 flex items-center gap-2">
<span class="text-sm font-bold text-emerald-600 dark:text-emerald-400">12/15 Present</span>
<span class="w-1 h-1 bg-slate-300 rounded-full"></span>
<span class="text-xs text-slate-500">Dr. Jenkins</span>
</div>
<div class="mt-3 flex -space-x-2">
<div class="w-6 h-6 rounded-full bg-slate-200 border-2 border-white dark:border-slate-800 flex items-center justify-center text-[8px] font-bold">SJ</div>
<div class="w-6 h-6 rounded-full bg-primary/10 border-2 border-white dark:border-slate-800 flex items-center justify-center text-[8px] font-bold text-primary">+12</div>
</div>
</div>
</div>
<div class="relative flex gap-6">
<div class="flex flex-col items-center z-10">
<div class="w-12 h-12 rounded-full bg-white dark:bg-slate-800 text-slate-400 flex items-center justify-center font-bold text-xs ring-4 ring-background-light dark:ring-background-dark border border-slate-200 dark:border-slate-700">
                    11:00
                </div>
</div>
<div class="flex-1 bg-white dark:bg-slate-800/60 p-4 rounded-2xl shadow-sm border border-slate-200/60 dark:border-slate-700/50">
<h4 class="font-bold text-slate-900 dark:text-white text-base">Quantum Physics Lab</h4>
<div class="mt-1 flex items-center gap-2">
<span class="text-sm font-bold text-amber-600 dark:text-amber-400">8/10 Present</span>
<span class="w-1 h-1 bg-slate-300 rounded-full"></span>
<span class="text-xs text-slate-500">Prof. Chen</span>
</div>
<div class="mt-3 flex items-center justify-between">
<div class="flex -space-x-2">
<div class="w-6 h-6 rounded-full bg-slate-200 border-2 border-white dark:border-slate-800 flex items-center justify-center text-[8px] font-bold">MC</div>
<div class="w-6 h-6 rounded-full bg-primary/10 border-2 border-white dark:border-slate-800 flex items-center justify-center text-[8px] font-bold text-primary">+8</div>
</div>
<span class="text-[10px] font-medium text-amber-600 bg-amber-50 dark:bg-amber-900/20 px-2 py-0.5 rounded">In Progress</span>
</div>
</div>
</div>
<div class="relative flex gap-6">
<div class="flex flex-col items-center z-10">
<div class="w-12 h-12 rounded-full bg-white dark:bg-slate-800 text-slate-400 flex items-center justify-center font-bold text-xs ring-4 ring-background-light dark:ring-background-dark border border-slate-200 dark:border-slate-700">
                    14:00
                </div>
</div>
<div class="flex-1 bg-white dark:bg-slate-800/60 p-4 rounded-2xl shadow-sm border border-slate-200/60 dark:border-slate-700/50 opacity-70">
<h4 class="font-bold text-slate-900 dark:text-white text-base">Art History</h4>
<div class="mt-1 flex items-center gap-2">
<span class="text-sm font-bold text-slate-400">--/20 Present</span>
<span class="w-1 h-1 bg-slate-300 rounded-full"></span>
<span class="text-xs text-slate-500">Elena Rodriguez</span>
</div>
<div class="mt-3 flex items-center justify-between">
<div class="flex -space-x-2">
<div class="w-6 h-6 rounded-full bg-slate-200 border-2 border-white dark:border-slate-800 flex items-center justify-center text-[8px] font-bold">ER</div>
</div>
<span class="text-[10px] font-medium text-slate-400 bg-slate-100 dark:bg-slate-700/50 px-2 py-0.5 rounded uppercase">Upcoming</span>
</div>
</div>
</div>
</div>
</main>
<nav class="fixed bottom-0 left-0 right-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 px-6 pb-6 pt-3 z-30">
<div class="flex items-center justify-between max-w-md mx-auto">
<a class="flex flex-col items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">school</span>
<span class="text-[10px] font-medium text-slate-500 group-hover:text-primary">Classes</span>
</a>
<a class="flex flex-col items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">group</span>
<span class="text-[10px] font-medium text-slate-500 group-hover:text-primary">Students</span>
</a>
<a class="flex flex-col items-center gap-1 group relative" href="#">
<div class="absolute -top-3 w-12 h-1 bg-primary rounded-full"></div>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
<span class="text-[10px] font-bold text-primary">Attendance</span>
</a>
<a class="flex flex-col items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">settings</span>
<span class="text-[10px] font-medium text-slate-500 group-hover:text-primary">Settings</span>
</a>
</div>
</nav>

</body></html>
